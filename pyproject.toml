[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bigquery-entity-matching"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["google-cloud-bigquery==3.38.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.2", "build==1.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
entity_matching = ["sql/*.sql"]

[tool.ruff]
line-length = 100
